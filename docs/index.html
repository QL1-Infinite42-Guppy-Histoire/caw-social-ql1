<title>CAW Social — QL1</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png?v=38">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=38">
<script>
  (function () {
    /* v36: twenty language shells. A returning visitor goes to
       the shell of the language they last used (viewer.js stores
       it as caw-lang on every boot); a new visitor to the shell
       matching their browser language when there is one, else
       English. */
    var LANGS = ['en', 'ja', 'zh', 'ko', 'es', 'tr', 'fa', 'id', 'vi', 'th',
                 'it', 'pt', 'nl', 'pl', 'uk', 'de', 'ru', 'ar', 'hi', 'fr'];
    var saved = null;
    try { saved = localStorage.getItem('caw-lang'); } catch (e) {}
    var lang = null;
    if (saved && LANGS.indexOf(saved) >= 0) lang = saved;
    if (!lang) {
      var nav = ((navigator.language || 'en').toLowerCase()).slice(0, 2);
      if (LANGS.indexOf(nav) >= 0) lang = nav;
    }
    if (!lang) lang = 'en';
    /* Keep the query string (and fragment) across the redirect:
       deep links such as ?mirror=1&item=<id> (the push-notification
       landing), ?post=, ?name= and ?reactions=1 must survive the
       language gate or they land on a plain home page. */
    location.replace(lang + '.html' + location.search + location.hash);
  })();
</script>
